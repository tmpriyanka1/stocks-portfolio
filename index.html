<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Seamlessly forward query parameters (like ?tab=analytics-screen) to portfolio.html
    const urlParams = window.location.search;
    window.location.replace('portfolio.html' + urlParams);
  </script>
</head>
<body>
  <p>Redirecting to <a href="portfolio.html">Portfolio Dashboard</a>...</p>
</body>
</html>
