<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanai — Secure Login</title>
  <meta name="description"
    content="Secure workspace access for Vanai Portfolio Manager. Enter your credentials to enter the dashboard.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Core Styles -->
  <link rel="stylesheet" href="styles.css?v=2.2">

  <style>
    /* =========================================================
       LOGIN PAGE STYLES
       ========================================================= */
    body {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
    }

    /* Animated ambient gradient orbs */
    .glow-orb {
      animation: orbDrift 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      animation-delay: 0s;
    }

    .orb-2 {
      animation-delay: -4s;
    }

    .orb-3 {
      animation-delay: -8s;
    }

    @keyframes orbDrift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(20px, -30px) scale(1.1);
      }
    }

    /* Login card — centered glassmorphic panel */
    .login-card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 360px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 28px 28px 28px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: cardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo + branding */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-align: center;
    }

    .login-avatar {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .login-app-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      font-family: var(--font-main);
    }

    .login-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: var(--font-main);
    }

    /* Form fields */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: var(--font-main);
    }

    .login-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .login-input-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .login-input {
      width: 100%;
      padding: 12px 12px 12px 38px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-main);
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
      user-select: text;
      -webkit-user-select: text;
    }

    .login-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-input:focus {
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(99, 102, 241, 0.06);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    /* Toggle password visibility button */
    .toggle-pw-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s ease;
    }

    .toggle-pw-btn:hover {
      color: var(--text-secondary);
    }

    /* Error message */
    .login-error {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--danger, #ef4444);
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: var(--font-main);
      font-weight: 500;
    }

    .login-error.visible {
      display: flex;
      animation: shakeError 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes shakeError {

      0%,
      100% {
        transform: translateX(0);
      }

      15% {
        transform: translateX(-6px);
      }

      45% {
        transform: translateX(6px);
      }

      75% {
        transform: translateX(-4px);
      }
    }

    /* Submit button */
    .login-btn {
      position: relative;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      font-family: var(--font-main);
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      overflow: hidden;
      margin-top: 4px;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .login-btn:hover::before {
      opacity: 1;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(99, 102, 241, 0.45);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .btn-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .login-btn.loading .btn-text {
      display: none;
    }

    .login-btn.loading .btn-spinner {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Default credentials hint */
    .login-hint {
      margin-top: 20px;
      padding: 10px 14px;
      background: rgba(99, 102, 241, 0.06);
      border: 1px dashed rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-main);
      text-align: center;
      line-height: 1.6;
    }

    .login-hint strong {
      color: var(--accent);
      font-weight: 600;
    }

    /* Divider line */
    .login-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <!-- Ambient background glow elements -->
  <div class="glow-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Login Card -->
  <div class="login-card" role="main">
    <!-- Brand Header -->
    <div class="login-brand">
      <div class="login-avatar" aria-hidden="true">VR</div>
      <div>
        <div class="login-app-name">Vanai</div>
        <div class="login-subtitle">Secure Workspace Access</div>
      </div>
    </div>

    <!-- Login Form -->
    <form class="login-form" id="loginForm" autocomplete="off" novalidate>

      <!-- Error Banner -->
      <div class="login-error" id="loginError" role="alert" aria-live="polite">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="loginErrorText">Invalid username or password.</span>
      </div>

      <!-- Username Field -->
      <div class="login-field">
        <label class="login-label" for="loginUsername">Username</label>
        <div class="login-input-wrapper">
          <span class="login-input-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input type="text" id="loginUsername" class="login-input" placeholder="Enter username" autocomplete="username"
            required aria-required="true">
        </div>
      </div>

      <!-- Password Field -->
      <div class="login-field">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="login-label" for="loginPassword">Password</label>
          <a href="#" id="forgotPasswordLink"
            style="font-size: 10px; font-weight: 600; color: var(--accent); text-decoration: none; text-transform: uppercase; letter-spacing: 0.5px; font-family: var(--font-main);">Forgot
            Password?</a>
        </div>
        <div class="login-input-wrapper">
          <span class="login-input-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input type="password" id="loginPassword" class="login-input" placeholder="Enter password"
            autocomplete="current-password" required aria-required="true">
          <button type="button" class="toggle-pw-btn" id="togglePwBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="login-btn" id="loginBtn" aria-label="Sign in to Vanai">
        <span class="btn-text">Enter Workspace →</span>
        <div class="btn-spinner" aria-hidden="true"></div>
      </button>

    </form>

    <!-- Forgot Password Form -->
    <form class="login-form" id="forgotPasswordForm" style="display: none;" autocomplete="off" novalidate>
      <div class="login-error" id="forgotError" role="alert" aria-live="polite">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="forgotErrorText">Not Registered</span>
      </div>

      <!-- Step 1: Enter Email/Phone & Generate OTP -->
      <div id="forgotStep1">
        <div class="login-field">
          <label class="login-label" for="forgotEmailOrPhone">Email or Phone Number</label>
          <div class="login-input-wrapper">
            <span class="login-input-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="text" id="forgotEmailOrPhone" class="login-input" placeholder="Enter email or phone..."
              required>
          </div>
        </div>
        <button type="button" class="login-btn" id="generateOtpBtn" style="margin-top: 14px;">
          <span class="btn-text">Generate OTP →</span>
          <div class="btn-spinner" aria-hidden="true"></div>
        </button>
      </div>

      <!-- Step 2: Enter OTP & Login (Initially Hidden) -->
      <div id="forgotStep2" style="display: none;">
        <div class="login-field">
          <label class="login-label" for="forgotOtp">Enter OTP</label>
          <div class="login-input-wrapper">
            <span class="login-input-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="text" id="forgotOtp" class="login-input" placeholder="Enter 6-digit OTP" maxLength="6"
              required>
          </div>
        </div>
        <button type="submit" class="login-btn" id="verifyOtpBtn" style="margin-top: 14px;">
          <span class="btn-text">Verify & Login →</span>
          <div class="btn-spinner" aria-hidden="true"></div>
        </button>
      </div>

      <!-- Back to Login option -->
      <div style="text-align: center; margin-top: 16px;">
        <a href="#" id="backToLoginLink"
          style="font-size: 11px; font-weight: 600; color: var(--text-muted); text-decoration: none; text-transform: uppercase; letter-spacing: 0.5px; font-family: var(--font-main);">Back
          to Login</a>
      </div>
    </form>

    <!-- Default Credentials Hint -->
    <div class="login-hint" role="note" aria-label="Default credentials hint">
      <strong>First Time?</strong> Default admin account:<br>
      Username: <strong>admin</strong> &nbsp;·&nbsp; Password: <strong>Admin@123!</strong>
    </div>
  </div>

  <script>
    (function () {
      var SESSION_KEY = 'portfolio_session';
      var BASE_API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || !window.location.hostname)
        ? 'http://localhost:5001/api/'
        : 'https://vanai-portfolio-backend.onrender.com/api/';
      var API_LOGIN_URL = BASE_API_URL + 'login';

      // If already authenticated, go straight to the dashboard
      try {
        var existing = sessionStorage.getItem(SESSION_KEY);
        if (existing) {
          var s = JSON.parse(existing);
          if (s && s.username && s.role) {
            window.location.replace('portfolio.html');
          }
        }
      } catch (e) { /* ignore */ }

      // Toggle password visibility
      var toggleBtn = document.getElementById('togglePwBtn');
      var pwInput = document.getElementById('loginPassword');
      var eyeIcon = document.getElementById('eyeIcon');
      toggleBtn.addEventListener('click', function () {
        var isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        eyeIcon.innerHTML = isHidden
          ? '<line x1="1" y1="1" x2="23" y2="23"></line><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      });

      // Show error banner
      function showError(msg) {
        var errEl = document.getElementById('loginError');
        var errText = document.getElementById('loginErrorText');
        errText.textContent = msg || 'Invalid username or password.';
        errEl.classList.remove('visible');
        // Force reflow to restart animation
        void errEl.offsetWidth;
        errEl.classList.add('visible');
      }

      function hideError() {
        document.getElementById('loginError').classList.remove('visible');
      }

      // Handle form submit
      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        hideError();

        var username = document.getElementById('loginUsername').value.trim();
        var password = document.getElementById('loginPassword').value;

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        var btn = document.getElementById('loginBtn');
        btn.classList.add('loading');
        
        var targetLoginUrl = API_LOGIN_URL;
        if (username.toLowerCase() !== 'tester') {
          targetLoginUrl = 'https://vanai-portfolio-backend.onrender.com/api/login';
        }

        fetch(targetLoginUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { status: res.status, data: data };
            });
          })
          .then(function (result) {
            btn.classList.remove('loading');
            if (result.status === 200 && result.data.success) {
              // Store session token
              sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                username: result.data.username,
                role: result.data.role
              }));
              // Redirect to dashboard
              window.location.replace('portfolio.html');
            } else {
              showError(result.data.error || 'Invalid username or password.');
            }
          })
          .catch(function (err) {
            btn.classList.remove('loading');
            showError('Cannot connect to the server. Make sure it is running on ' + BASE_API_URL.replace('/api/', '') + '.');
          });
      });

      // Clear error on input change
      document.getElementById('loginUsername').addEventListener('input', hideError);
      document.getElementById('loginPassword').addEventListener('input', hideError);

      // Forgot Password Elements
      var forgotLink = document.getElementById('forgotPasswordLink');
      var backToLoginLink = document.getElementById('backToLoginLink');
      var loginForm = document.getElementById('loginForm');
      var forgotPasswordForm = document.getElementById('forgotPasswordForm');
      var generateOtpBtn = document.getElementById('generateOtpBtn');
      var verifyOtpBtn = document.getElementById('verifyOtpBtn');
      var forgotEmailOrPhone = document.getElementById('forgotEmailOrPhone');
      var forgotOtp = document.getElementById('forgotOtp');
      var forgotStep1 = document.getElementById('forgotStep1');
      var forgotStep2 = document.getElementById('forgotStep2');

      // Local mock OTP variable for offline fallback
      var mockOtpVal = null;
      var mockUser = null;

      function showForgotError(msg) {
        var errEl = document.getElementById('forgotError');
        var errText = document.getElementById('forgotErrorText');
        errText.textContent = msg || 'An error occurred.';
        errEl.classList.remove('visible');
        void errEl.offsetWidth;
        errEl.classList.add('visible');
      }

      function hideForgotError() {
        var errEl = document.getElementById('forgotError');
        if (errEl) errEl.classList.remove('visible');
      }

      // Switch to Forgot Password
      forgotLink.addEventListener('click', function (e) {
        e.preventDefault();
        hideError();
        hideForgotError();
        loginForm.style.display = 'none';
        forgotPasswordForm.style.display = 'block';
        forgotStep1.style.display = 'block';
        forgotStep2.style.display = 'none';
        forgotEmailOrPhone.value = '';
        forgotOtp.value = '';
        mockOtpVal = null;
        mockUser = null;
      });

      // Switch to Login
      backToLoginLink.addEventListener('click', function (e) {
        e.preventDefault();
        hideError();
        hideForgotError();
        loginForm.style.display = 'block';
        forgotPasswordForm.style.display = 'none';
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
      });

      // Generate OTP
      generateOtpBtn.addEventListener('click', function () {
        hideForgotError();
        var val = forgotEmailOrPhone.value.trim();
        if (!val) {
          showForgotError('Email or Phone Number is required.');
          return;
        }

        generateOtpBtn.classList.add('loading');

        fetch(BASE_API_URL + 'forgot-password/otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailOrPhone: val })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { status: res.status, data: data };
            });
          })
          .then(function (result) {
            generateOtpBtn.classList.remove('loading');
            if (result.status === 200 && result.data.success) {
              forgotStep1.style.display = 'none';
              forgotStep2.style.display = 'block';
            } else {
              showForgotError(result.data.error || 'Not Registered');
            }
          })
          .catch(function (err) {
            console.warn('Server offline, trying local storage fallback...', err);
            // Fallback: search localStorage for user with matching email or phoneNumber
            var localUsers = [];
            try {
              localUsers = JSON.parse(localStorage.getItem('portfolio_users') || '[]');
            } catch (e) {
              localUsers = [];
            }
            // Always check admin too
            var adminUser = {
              username: 'admin',
              role: 'admin',
              email: 'admin@vanai.co',
              phoneNumber: '+15550199',
              password: 'Admin@123!'
            };
            if (!localUsers.some(function (u) { return u.username === 'admin'; })) {
              localUsers.unshift(adminUser);
            }

            var queryVal = val.toLowerCase();
            var matched = localUsers.find(function (u) {
              return (u.email && u.email.trim().toLowerCase() === queryVal) ||
                (u.phoneNumber && u.phoneNumber.trim().toLowerCase() === queryVal);
            });

            generateOtpBtn.classList.remove('loading');
            if (matched) {
              // Generate mock OTP
              mockOtpVal = String(Math.floor(100000 + Math.random() * 900000));
              mockUser = matched;
              // Write local OTP to console and show non-blocking toast overlay
              console.log('[Mock OTP Fallback] Generated OTP:', mockOtpVal, 'for user:', matched.username);

              var toastEl = document.createElement('div');
              toastEl.style.position = 'fixed';
              toastEl.style.bottom = '20px';
              toastEl.style.left = '50%';
              toastEl.style.transform = 'translateX(-50%)';
              toastEl.style.background = 'rgba(0,0,0,0.85)';
              toastEl.style.color = '#fff';
              toastEl.style.padding = '10px 20px';
              toastEl.style.borderRadius = '5px';
              toastEl.style.zIndex = '9999';
              toastEl.style.fontFamily = 'sans-serif';
              toastEl.style.fontSize = '12px';
              toastEl.textContent = 'Mock OTP: ' + mockOtpVal;
              document.body.appendChild(toastEl);
              setTimeout(function () { toastEl.remove(); }, 6000);

              forgotStep1.style.display = 'none';
              forgotStep2.style.display = 'block';
            } else {
              showForgotError('Not Registered');
            }
          });
      });

      // Submit verification OTP & login
      forgotPasswordForm.addEventListener('submit', function (e) {
        e.preventDefault();
        hideForgotError();
        var val = forgotEmailOrPhone.value.trim();
        var otpVal = forgotOtp.value.trim();

        if (!val || !otpVal) {
          showForgotError('Email/Phone and OTP are required.');
          return;
        }

        verifyOtpBtn.classList.add('loading');

        fetch(BASE_API_URL + 'forgot-password/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailOrPhone: val, otp: otpVal })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { status: res.status, data: data };
            });
          })
          .then(function (result) {
            verifyOtpBtn.classList.remove('loading');
            if (result.status === 200 && result.data.success) {
              sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                username: result.data.username,
                role: result.data.role
              }));
              window.location.replace('portfolio.html');
            } else {
              showForgotError(result.data.error || 'Invalid or expired OTP.');
            }
          })
          .catch(function (err) {
            console.warn('Server offline, trying local storage verify fallback...', err);
            verifyOtpBtn.classList.remove('loading');
            if (mockOtpVal && otpVal === mockOtpVal && mockUser) {
              sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                username: mockUser.username,
                role: mockUser.role
              }));
              window.location.replace('portfolio.html');
            } else {
              showForgotError('Invalid or expired OTP.');
            }
          });
      });

      // Clear forgot error on input
      forgotEmailOrPhone.addEventListener('input', hideForgotError);
      forgotOtp.addEventListener('input', hideForgotError);
    })();
  </script>
</body>

</html>
