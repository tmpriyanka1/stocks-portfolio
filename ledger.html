<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanai - Grouped Position Reports</title>
  <!-- Modern Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Core Styles -->
  <link rel="stylesheet" href="styles.css?v=2.2">
  <!-- Screen-specific Styles -->
  <link rel="stylesheet" href="ledger.css?v=2.2">
</head>

<body>
  <!-- Ambient background glow elements for premium aesthetics -->
  <div class="glow-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Master App Container (constrained viewport) -->
  <div class="app-container" id="app-container">

    <!-- Screen 2: The Grouped Position Ledger -->
    <main class="screen-view active" id="screen-ledger-view" aria-label="Ledger Screen">
      <!-- Header -->
      <header class="app-header">
        <div class="profile-section">
          <div class="avatar logo-vr">VR</div>
          <div class="greeting-info">
            <span class="sub-title">History & Transactions</span>
            <h1 class="user-title">Reports</h1>
          </div>
        </div>
      </header>

      <!-- Time Filter Button Row at the very top of the ledger -->
      <section class="filter-section" id="ledger-filters">
        <div class="pill-group">
          <div class="pill-slider" id="ledger-slider"></div>
          <button class="pill-btn active" data-range="daily">Daily</button>
          <button class="pill-btn" data-range="weekly">Weekly</button>
          <button class="pill-btn" data-range="monthly">Monthly</button>
          <button class="pill-btn" data-range="yearly">Yearly</button>
          <button class="pill-btn filter-btn" data-range="all">All Time</button>
        </div>
      </section>

      <!-- Section 1: Dynamic performance snapshot card -->
      <section class="snapshot-overview-section" id="snapshot-section1" style="margin: 0 24px 20px 24px;">
        <div class="snapshot-card-container" style="padding: 16px 20px;">
          <div class="snap-metrics-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px;">
            <div class="snap-metric-block" style="display: flex; flex-direction: column; gap: 2px;">
              <span class="snap-label" style="font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500;">Period Open</span>
              <span id="snap-start-value" class="snap-value" style="font-size: 14px; font-weight: 600; color: var(--text-primary); font-family: var(--font-main);">$0.00</span>
            </div>
            <div class="snap-metric-block text-center" style="display: flex; flex-direction: column; gap: 2px; text-align: center;">
              <span class="snap-label" style="font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500;">Period P&L ($)</span>
              <span id="snap-pnl-value" class="snap-value pnl-neutral" style="font-size: 14px; font-weight: 600; font-family: var(--font-main); color: var(--text-secondary);">$0.00</span>
            </div>
            <div class="snap-metric-block text-right" style="display: flex; flex-direction: column; gap: 2px; text-align: right;">
              <span class="snap-label" style="font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500;">Current Value</span>
              <span id="snap-current-value" class="snap-value" style="font-size: 14px; font-weight: 600; color: var(--text-primary); font-family: var(--font-main);">$0.00</span>
            </div>
          </div>
          <div class="snap-graph-wrapper" style="width: 100%; height: 64px; margin-bottom: 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.15); padding: 6px 0; overflow: visible;">
            <svg class="snap-interval-chart" viewBox="0 0 300 60" preserveAspectRatio="none" style="width: 100%; height: 100%; overflow: visible;">
              <defs>
                <linearGradient id="snap-graph-gradient" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
                  <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.00"/>
                </linearGradient>
              </defs>
              <path id="snap-graph-area" d="" fill="url(#snap-graph-gradient)" />
              <path id="snap-trend-path" d="M 0 30 L 300 30" fill="none" stroke="var(--text-muted)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              <g id="snap-graph-dots"></g>
            </svg>
          </div>
        </div>
      </section>

      <!-- Split layout inside independent table scroll track -->
      <section class="table-section">
        <div class="table-container" id="ledger-scroll-container">

          <!-- 🟢 Active Positions section -->
          <div class="ledger-section">
            <h2 class="ledger-group-header">
              <span class="status-icon active-dot">🟢</span> Active Positions
            </h2>
            <div class="ledger-list" id="active-ledger-list">
              <!-- Rendered Active Master Cards will go here -->
              <div class="ledger-empty pulse-text">Loading active ledger...</div>
            </div>
          </div>

          <!-- ⚪ Closed Positions section -->
          <div class="ledger-section" style="margin-top: 24px;">
            <h2 class="ledger-group-header">
              <span class="status-icon completed-dot">⚪</span> Closed Positions
            </h2>
            <div class="ledger-list" id="completed-ledger-list">
              <!-- Rendered Closed Master Cards will go here -->
              <div class="ledger-empty pulse-text">Loading closed ledger...</div>
            </div>
          </div>

        </div>
      </section>
    </main>

    <!-- Bottom Tab Bar (System Navigation Pinned to Bottom) -->
    <nav class="bottom-tab-bar" aria-label="Main Navigation">
      <button class="tab-btn" data-target="screen-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        <span class="tab-label">Portfolio</span>
      </button>
      <button class="tab-btn active" data-target="screen-ledger">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
        <span class="tab-label">Reports</span>
      </button>
      <button class="tab-btn" data-target="screen-entry">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <span class="tab-label">Add Trade</span>
      </button>
      <button class="tab-btn" data-target="settings-screen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        <span class="tab-label">Settings</span>
      </button>
    </nav>

  </div>

  <script src="ledger.js?v=2.2" defer></script>
</body>

</html>
