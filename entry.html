<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vanai - Log Execution</title>
  <!-- Modern Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Core Styles -->
  <link rel="stylesheet" href="styles.css?v=2.2">
  <!-- Screen-specific Styles -->
  <link rel="stylesheet" href="entry.css?v=2.2">
</head>

<body>
  <!-- Ambient background glow elements for premium aesthetics -->
  <div class="glow-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Master App Container (constrained viewport) -->
  <div class="app-container" id="app-container">

    <!-- Screen 3: Add Trade View -->
    <main class="screen-view active" id="entry-screen" aria-label="Add Trade Screen">
      <!-- Header -->
      <header class="app-header">
        <div class="profile-section">
          <div class="avatar logo-vr">VR</div>
          <div class="greeting-info">
            <span class="sub-title">Trade Logger</span>
            <h1 class="user-title">Log Execution</h1>
          </div>
        </div>
        <div class="header-right-actions">
          <div id="account-pill-container" class="account-pill-container">
            <div
              style="color: var(--text-muted); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span id="header-username-display">User</span>
            </div>
            <select id="global-portfolio-switcher" class="portfolio-switcher">
              <option value="long_term">Long Term</option>
              <option value="short_term">Short Term</option>
              <option value="kids">Kids</option>
            </select>
          </div>
        </div>
      </header>

      <!-- Glassmorphic Input Form Container -->
      <div class="entry-form-container">
        <form id="tradeForm">
          <!-- Three-Way UI Selector Toggle -->
          <div class="form-toggle-container">
            <button type="button" class="toggle-btn active" data-mode="stock">Stock</button>
            <button type="button" class="toggle-btn" data-mode="option">Option</button>
          </div>
          <input type="hidden" id="formMode" value="stock">
          <input type="hidden" id="inputType" value="stocks">

          <!-- Ticker Symbol (Hidden for Cash) -->
          <div class="form-group" id="group-ticker">
            <label for="inputTicker">Ticker Symbol</label>
            <input type="text" id="inputTicker" placeholder="e.g. NVDA" required autocomplete="off">
          </div>

          <!-- Action / Cash Action Row -->
          <div class="form-row" id="group-action-row">
            <!-- Action (Buy/Sell) (Hidden for Cash) -->
            <div class="form-group half-width hidden" id="group-action">
              <label>Action Type</label>
              <div class="action-desk">
                <button type="button" class="action-pill active" data-action="BUY">BUY</button>
                <button type="button" class="action-pill" data-action="SELL">SELL</button>
              </div>
              <input type="hidden" id="inputAction" value="BUY" required>
            </div>

            <!-- Cash Action (Deposit/Withdrawal) (Hidden for Stock/Option) -->
            <div class="form-group half-width hidden" id="group-cash-action">
              <label for="inputCashAction">Cash Action</label>
              <select id="inputCashAction">
                <option value="DEPOSIT">Deposit</option>
                <option value="WITHDRAWAL">Withdrawal</option>
              </select>
            </div>
          </div>

          <!-- Quantity / Amount & Price Row -->
          <div class="form-row" id="group-qty-price">
            <!-- Quantity (Shares) (Hidden for Cash) -->
            <div class="form-group half-width" id="group-shares">
              <label for="inputShares">Quantity</label>
              <input type="number" id="inputShares" min="1" placeholder="e.g. 10" required>
            </div>

            <!-- Price / Amount ($) (Label updates dynamically to Amount ($) for Cash) -->
            <div class="form-group half-width" id="group-price">
              <label for="inputPrice" id="labelPrice">Price ($)</label>
              <input type="number" id="inputPrice" min="0.01" step="0.01" placeholder="e.g. 485.00" required>
            </div>
          </div>

          <!-- Date & Time Row -->
          <div class="form-row">
            <div class="form-group half-width">
              <label for="inputDate">Date</label>
              <input type="date" id="inputDate" required>
            </div>

            <div class="form-group half-width">
              <label for="inputTime">Time</label>
              <input type="time" id="inputTime" step="1" required>
            </div>
          </div>

          <!-- Expiry Date & Stop Loss Row -->
          <div class="form-row" id="group-expiry-sl">
            <!-- Expiry Date (Hidden for Stock/Cash) -->
            <div class="form-group half-width hidden" id="group-expiry">
              <label for="inputExpiry">Expiry Date</label>
              <input type="date" id="inputExpiry">
            </div>

            <!-- Stop Limit (SL) (Hidden for Cash) -->
            <div class="form-group half-width" id="group-sl">
              <label for="inputSL">STOP LIMIT (SL)</label>
              <input type="number" id="inputSL" min="0.01" step="0.01" placeholder="Optional (e.g. 430.00)">
            </div>
          </div>

          <!-- Option Type (Hidden for Stock/Cash) -->
          <div class="form-group hidden" id="group-option-type">
            <label for="inputOptionType">Option Type</label>
            <select id="inputOptionType">
              <option value="CALL">Call</option>
              <option value="PUT">Put</option>
            </select>
          </div>

          <!-- Trade Journal Note (Hidden for Cash) -->
          <div class="form-group" id="group-comment">
            <label for="inputComment">Trade Journal Note</label>
            <textarea id="inputComment" placeholder="Add adviser evaluation notes..." rows="3"></textarea>
          </div>

          <button type="submit" class="submit-button" id="submitBtn">
            🟢 Submit
          </button>
        </form>
      </div>
    </main>

    <!-- Bottom Tab Bar (System Navigation Pinned to Bottom) -->
    <nav class="bottom-tab-bar" aria-label="Main Navigation">
      <button class="tab-btn" data-target="screen-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        <span class="tab-label">Portfolio</span>
      </button>
      <button class="tab-btn" data-target="screen-ledger">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
        <span class="tab-label">Reports</span>
      </button>
      <button class="tab-btn active" data-target="screen-entry">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <span class="tab-label">Add Trade</span>
      </button>
      <button class="tab-btn" data-target="settings-screen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        <span class="tab-label">Settings</span>
      </button>
    </nav>

  </div>

  <script src="auth-guard.js?v=4"></script>
  <script src="entry.js?v=4" defer></script>
</body>

</html>
